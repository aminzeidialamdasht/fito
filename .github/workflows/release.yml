name: Release Fito APK (Multi-Flavor)

on:
  push:
    tags:
      - 'v*-myket'
      - 'v*-bazaar'
      - 'v*-personal'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Flavor & Version from Tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # استخراج flavor از انتهای tag
          FLAVOR="${TAG##*-}"
          # استخراج نسخه (حذف v و -flavor)
          CLEAN_VERSION="${TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION%-$FLAVOR}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "✅ Tag: $TAG"
          echo "✅ Flavor: $FLAVOR"
          echo "✅ Version: $CLEAN_VERSION (code=$VERSION_CODE)"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application (${{ env.FLAVOR }} flavor)
        run: npm run build:${{ env.FLAVOR }}

      - name: Add Android Platform
        run: npx cap add android

      - name: Patch Android Repositories (JitPack + Myket)
        run: node scripts/patch-android-repos.mjs
      - name: Patch Android Manifest Placeholders (FLAVOR)
        run: FLAVOR=${{ env.FLAVOR || 'myket' }} node scripts/patch-android-manifest.mjs

      - name: Apply Fito Launcher Icons
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values" "$RES/xml"
          rm -f "$RES/values/ic_launcher_background.xml"
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/drawable-$D"
            cp -f native-assets/android/drawable-$D/* "$RES/drawable-$D/" 2>/dev/null || true
          done
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
            cp -f native-assets/android/mipmap-$D/* "$RES/mipmap-$D/" 2>/dev/null || true
          done
          cp -f native-assets/android/mipmap-anydpi-v26/* "$RES/mipmap-anydpi-v26/" 2>/dev/null || true
          cp -f native-assets/android/values/ic_launcher_colors.xml "$RES/values/" 2>/dev/null || true
          cp -f native-assets/android/xml/config.xml "$RES/xml/" 2>/dev/null || true
          echo "✅ Fito launcher icons applied"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - name: Patch Android Signing Config
        run: |
          cd android/app
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('build.gradle', 'utf8');
          if (!content.includes('signingConfigs {')) {
            const signingBlock = \`    signingConfigs {
                release {
                    def keystorePath = System.getenv(\"KEYSTORE_PATH\")
                    if (keystorePath) {
                        storeFile file(keystorePath)
                        storePassword System.getenv(\"KEYSTORE_PASSWORD\")
                        keyAlias System.getenv(\"KEY_ALIAS\")
                        keyPassword System.getenv(\"KEY_PASSWORD\")
                    }
                }
            }
          \`;
            content = content.replace('buildTypes {', signingBlock + '    buildTypes {');
            content = content.replace(
              'release {\\n            minifyEnabled false',
              'release {\\n            def keystorePath = System.getenv(\"KEYSTORE_PATH\")\\n            if (keystorePath) {\\n                signingConfig signingConfigs.release\\n            }\\n            minifyEnabled false'
            );
            fs.writeFileSync('build.gradle', content);
          }
          "

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unaligned.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK was generated"
            exit 1
          fi
          echo "APK_PATH=android/$APK_PATH" >> "$GITHUB_ENV"

      - name: Rename APK
        run: |
          mkdir -p release
          cp "$APK_PATH" "release/Fito-v${{ env.CLEAN_VERSION }}-${{ env.FLAVOR }}.apk"
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          name: "Fito v${{ env.CLEAN_VERSION }} (${{ env.FLAVOR }})"
          body: |
            ## 🏋️ Fito v${{ env.CLEAN_VERSION }} — ${{ env.FLAVOR }}

            اپ فیتنس کاملاً آفلاین

            ### 📱 اطلاعات بیلد:
            - **Flavor:** `${{ env.FLAVOR }}`
            - **App ID:** `com.fito.app`
            - **Version:** ${{ env.CLEAN_VERSION }}
            - **VersionCode:** ${{ env.VERSION_CODE }}

            ---
            ساخته شده با ❤️ برای جامعه بدنسازی ایران
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Fito Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Flavor:** ${{ env.FLAVOR }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.CLEAN_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **VersionCode:** ${{ env.VERSION_CODE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** \`Fito-v${{ env.CLEAN_VERSION }}-${{ env.FLAVOR }}.apk\`" >> $GITHUB_STEP_SUMMARY
