name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Build Flavor from Tag
        id: flavor
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *"-myket" ]]; then
            FLAVOR="myket"
            APK_PREFIX="کوچینو (Coachino)-Myket"
            CLEAN_VERSION="${TAG%-myket}"
          elif [[ "$TAG" == *"-bazaar" ]]; then
            FLAVOR="bazaar"
            APK_PREFIX="کوچینو (Coachino)-Bazaar"
            CLEAN_VERSION="${TAG%-bazaar}"
          else
            FLAVOR="personal"
            APK_PREFIX="AI-Fitness-Personal"
            CLEAN_VERSION="${TAG}"
          fi

          # حذف v از ابتدای نسخه (v1.6.1 → 1.6.1)
          CLEAN_VERSION="${CLEAN_VERSION#v}"

          # محاسبه versionCode از نسخه semantic (1.6.1 → 10601)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV
          echo "APP_NAME=Coachino" >> $GITHUB_ENV
          echo "APK_PREFIX=$APK_PREFIX" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "✅ Flavor: $FLAVOR"
          echo "✅ Version: $CLEAN_VERSION"
          echo "✅ VersionCode: $VERSION_CODE"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build:${{ env.FLAVOR }}

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Patch Bazaar billing
        if: env.FLAVOR == 'bazaar'
        env:
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.CLEAN_VERSION }}
        run: python3 scripts/patch-android-billing.py

      - name: Patch Myket billing
        if: env.FLAVOR == 'myket'
        env:
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.CLEAN_VERSION }}
        run: python3 scripts/patch-android-billing-myket.py

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - name: Sync Capacitor
        run: npm run sync:${{ env.FLAVOR }}

      - name: Apply Launcher Icons
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values"
          rm -f "$RES/values/ic_launcher_background.xml"
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/drawable-$D"; cp -f native-assets/android/drawable-$D/* "$RES/drawable-$D/"; done
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/mipmap-$D"; cp -f native-assets/android/mipmap-$D/* "$RES/mipmap-$D/"; done
          cp -f native-assets/android/mipmap-anydpi-v26/* "$RES/mipmap-anydpi-v26/"
          cp -f native-assets/android/values/ic_launcher_colors.xml "$RES/values/"

      - name: Update Gradle Wrapper
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.13-bin.zip|g' gradle/wrapper/gradle-wrapper.properties

      - name: Patch Android Signing Config
        run: |
          cd android/app
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('build.gradle', 'utf8');
          if (!content.includes('signingConfigs {')) {
            const signingBlock = \`    signingConfigs {
                release {
                    def keystorePath = System.getenv(\"KEYSTORE_PATH\")
                    if (keystorePath) {
                        storeFile file(keystorePath)
                        storePassword System.getenv(\"KEYSTORE_PASSWORD\")
                        keyAlias System.getenv(\"KEY_ALIAS\")
                        keyPassword System.getenv(\"KEY_PASSWORD\")
                    }
                }
            }
          \`;
            content = content.replace('buildTypes {', signingBlock + '    buildTypes {');
            content = content.replace(
              'release {\\n            minifyEnabled false',
              'release {\\n            def keystorePath = System.getenv(\"KEYSTORE_PATH\")\\n            if (keystorePath) {\\n                signingConfig signingConfigs.release\\n            }\\n            minifyEnabled false'
            );
            fs.writeFileSync('build.gradle', content);
          }
          "

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unaligned.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK was generated"
            exit 1
          fi
          echo "APK_PATH=android/$APK_PATH" >> "$GITHUB_ENV"

      - name: Rename APK
        run: |
          mkdir -p release
          cp "$APK_PATH" "release/${{ env.APK_PREFIX }}-v${{ env.CLEAN_VERSION }}.apk"
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          name: "${{ env.APK_PREFIX }} v${{ env.CLEAN_VERSION }}"
          body: |
            ## 🏋️ انتشار نسخه ${{ env.CLEAN_VERSION }} (${{ env.FLAVOR }})

            ### 📱 اطلاعات بیلد:
            - **فروشگاه:** ${{ env.FLAVOR == 'myket' && 'مایکت' || env.FLAVOR == 'bazaar' && 'کافه‌بازار' || 'نسخه شخصی' }}
            - **نسخه:** ${{ env.CLEAN_VERSION }}
            - **VersionCode:** ${{ env.VERSION_CODE }}
            - **App ID:** ${{ env.FLAVOR == 'personal' && 'com.amin.aifitness.personal' || 'com.aifitness.coach' }}

            ### 🔧 اطلاعات فنی:
            - حداقل Android: 7.0 (API 24)
            - معماری: Universal

            ---
            **ساخته شده با ❤️ برای جامعه بدنسازی ایران**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Release Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Flavor:** ${{ env.FLAVOR }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.CLEAN_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **VersionCode:** ${{ env.VERSION_CODE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ env.APK_PREFIX }}-v${{ env.CLEAN_VERSION }}.apk" >> $GITHUB_STEP_SUMMARY
