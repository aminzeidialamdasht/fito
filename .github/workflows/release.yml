name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: Coachino

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "✅ Android SDK configured"

      - name: Install Dependencies
        run: |
          npm ci
          echo "✅ Dependencies installed"

      - name: Build Web Application
        run: |
          npm run build
          echo "✅ Web app built"

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          echo "✅ Android platform added"

      - name: Patch Cafe Bazaar billing
        env:
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          python3 scripts/patch-android-billing.py

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - name: Sync Capacitor
        run: |
          npx cap sync android
          echo "✅ Capacitor synced"

      - name: Apply Coachino launcher icons
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values"
          rm -f "$RES/values/ic_launcher_background.xml"
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/drawable-$D"; cp -f native-assets/android/drawable-$D/* "$RES/drawable-$D/"; done
          cp -f native-assets/android/mipmap-anydpi-v26/* "$RES/mipmap-anydpi-v26/"
          cp -f native-assets/android/values/ic_launcher_colors.xml "$RES/values/"
          echo "✅ Coachino launcher icons applied"

      - name: Update Gradle Wrapper
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.13-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
          echo "✅ Gradle wrapper updated"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✅ Release APK built"

      - name: Get Version from Tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ Version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/کوچینو (Coachino)-v${{ env.VERSION }}.apk"
          echo "✅ APK renamed"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          name: "کوچینو (Coachino) v${{ env.VERSION }}"
          body: |
            ## 🏋️ کوچینو (Coachino) نسخه ${{ env.VERSION }}
            
            ### ✨ ویژگی‌های اصلی:
            - 🤖 تولید برنامه تمرینی با هوش مصنوعی
            - 📊 ردیابی پیشرفت و آمار کامل
            - 📅 تقویم شمسی
            - 🎯 مدیریت چند پروفایل ورزشکار
            - 💪 ردیاب تمرین حرفه‌ای
            - 🌙 تم تاریک و روشن
            
            ### 📱 نصب:
            1. فایل APK را دانلود کنید
            2. روی فایل کلیک کنید
            3. مجوز نصب از منابع ناشناس را بدهید
            4. نصب را تکمیل کنید
            
            ### 🔧 اطلاعات فنی:
            - حداقل Android: 7.0 (API 24)
            - حجم: ~15 MB
            - معماری: Universal
            
            ---
            **ساخته شده با ❤️ برای جامعه بدنسازی ایران**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Release Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** کوچینو (Coachino)-v${{ env.VERSION }}.apk" >> $GITHUB_STEP_SUMMARY
