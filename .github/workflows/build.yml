name: Build Coachino APK

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: Coachino

jobs:
  build:
    name: Build Coachino Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Patch Cafe Bazaar billing
        env:
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
        run: |
          python3 scripts/patch-android-billing.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Coachino launcher icons
        run: |
          # Capacitor regenerates android/; copy adaptive icons from native-assets
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values"
          # Avoid Duplicate resources: Capacitor ships values/ic_launcher_background.xml
          rm -f "$RES/values/ic_launcher_background.xml"
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/drawable-$D"; cp -f native-assets/android/drawable-$D/* "$RES/drawable-$D/"; done
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/mipmap-$D"; cp -f native-assets/android/mipmap-$D/* "$RES/mipmap-$D/"; done
          cp -f native-assets/android/mipmap-anydpi-v26/* "$RES/mipmap-anydpi-v26/"
          cp -f native-assets/android/values/ic_launcher_colors.xml "$RES/values/"
          echo "✅ Coachino launcher icons applied"

      - name: Update Gradle Wrapper
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.13-bin.zip|g' gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/کوچینو (Coachino).apk"

      - name: Upload Coachino APK
        uses: actions/upload-artifact@v4
        with:
          name: کوچینو (Coachino)-Debug
          path: android/app/build/outputs/apk/debug/کوچینو (Coachino).apk
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## کوچینو (Coachino) — Debug Build" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- APK: کوچینو (Coachino).apk" >> $GITHUB_STEP_SUMMARY
