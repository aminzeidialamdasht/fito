name: Build Fito APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: Fito

jobs:
  build:
    name: Build Fito Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Patch Android Repositories (JitPack + Myket)
        run: node scripts/patch-android-repos.mjs



      - name: Apply Fito Launcher Icons
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values" "$RES/xml"
          rm -f "$RES/values/ic_launcher_background.xml"
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/drawable-$D"
            cp -f native-assets/android/drawable-$D/* "$RES/drawable-$D/" 2>/dev/null || true
          done
          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
            cp -f native-assets/android/mipmap-$D/* "$RES/mipmap-$D/" 2>/dev/null || true
          done
          cp -f native-assets/android/mipmap-anydpi-v26/* "$RES/mipmap-anydpi-v26/" 2>/dev/null || true
          cp -f native-assets/android/values/ic_launcher_colors.xml "$RES/values/" 2>/dev/null || true
          cp -f native-assets/android/xml/config.xml "$RES/xml/" 2>/dev/null || true
          echo "✅ Fito launcher icons applied"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android Plugins (remove conflicting billing plugin)
        run: FLAVOR=${{ env.FLAVOR || 'myket' }} node scripts/patch-android-plugins.mjs

      - name: Patch Android Manifest Placeholders (FLAVOR)
        run: FLAVOR=${{ env.FLAVOR || 'myket' }} node scripts/patch-android-manifest.mjs

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Fito-v2.0.0-debug.apk"
          ls -la release/

      - name: Upload Fito APK
        uses: actions/upload-artifact@v4
        with:
          name: Fito-Debug-APK
          path: release/Fito-v2.0.0-debug.apk
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## 🏋️ Fito Debug Build" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`Fito-v2.0.0-debug.apk\`" >> $GITHUB_STEP_SUMMARY
