name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: AI-Fitness-Coach

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "✅ Android SDK configured"

      - name: Install Dependencies
        run: |
          npm ci
          echo "✅ Dependencies installed"

      - name: Build Web Application
        run: |
          npm run build
          echo "✅ Web app built"

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          echo "✅ Android platform added"

      - name: Patch Cafe Bazaar billing
        env:
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
        run: |
          python3 scripts/patch-android-billing.py

      - name: Sync Capacitor
        run: |
          npx cap sync android
          echo "✅ Capacitor synced"

      - name: Update Gradle Wrapper
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.13-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
          echo "✅ Gradle wrapper updated"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "✅ Debug APK built"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fitness-Coach-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Debug Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "APK file is available in the artifacts section." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Create Release" >> $GITHUB_STEP_SUMMARY
          echo "To create a release, push a tag:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "git tag v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "git push origin v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
